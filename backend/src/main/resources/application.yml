spring:
  application:
    name: portfolio-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rehan_portfolio?allowPublicKeyRetrieval=true&useSSL=false&defaultAuthenticationPlugin=mysql_native_password}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

admin:
  username: ${ADMIN_USERNAME:}
  password-hash: ${ADMIN_PASSWORD_HASH:}
  jwt-secret: ${ADMIN_JWT_SECRET:}
  jwt-ttl-minutes: ${ADMIN_JWT_TTL_MINUTES:60}

contact:
  notification-email: ${CONTACT_NOTIFICATION_EMAIL:}

rate-limit:
  max-requests: ${RATE_LIMIT_MAX_REQUESTS:5}
  window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15}
  trust-proxy-headers: ${RATE_LIMIT_TRUST_PROXY_HEADERS:false}
